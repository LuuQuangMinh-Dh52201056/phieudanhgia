services:
  - type: web
    name: phieu-danh-gia-lai-xe-phu-giao
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_FIREBASE_PROJECT_ID
        value: webdanhgia-3417e
      - key: VITE_FIREBASE_ADMIN_UIDS
        value: 4aEUDPqy7sa5biKeBUO9KjiCtvo1

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
